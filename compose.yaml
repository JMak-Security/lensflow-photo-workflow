services:
  lensflow:
    build: .
    command:
      ["build", "/input", "--output", "/export/${LENSFLOW_OUTPUT_NAME:-synthetic-run}"]
    user: "10001:10001"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - ./samples/synthetic-set:/input:ro
      - ./output:/export
